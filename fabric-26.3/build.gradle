plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
}
version = '1.2.1'
group = 'io.github.suunxh.caport'
base { archivesName = 'caport-fabric-26.3' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
    testImplementation 'junit:junit:4.13.2'
}
// Share tested geometry/search/command policy without packaging any Forge classes.
sourceSets.main.java { srcDir '../src/main/java'; include '**/core/**', 'io/github/suunxh/caport/fabric/**' }
sourceSets.test.java { srcDir '../src/test/java'; include '**/core/**', 'io/github/suunxh/caport/fabric/**' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }

test { useJUnit() }
loom {
    runs {
        client { if (System.getenv('CAPORT_SMOKE_TEST') == '1') vmArg '-Dcaport.smokeTest=true' }
    }
}
