buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.maven.apache.org/maven2' }
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-20211118.174922-42' }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.0.1'
group = 'io.github.suunxh.housingteleporthelper'
archivesBaseName = 'caport'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
    makeObfSourceJar = false
}
// Legacy ForgeGradle supplies some HTTP repositories. Prefer their HTTPS endpoints.
repositories.all { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
        def address = repo.url.toString()
        if (address.startsWith('http://')) repo.url = address.replaceFirst('http://', 'https://')
        if (address.contains('files.minecraftforge.net/maven')) repo.url = 'https://maven.minecraftforge.net'
    }
}
repositories { maven { url = 'https://repo.maven.apache.org/maven2' } }
dependencies { testCompile 'junit:junit:4.13.2' }

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand version: project.version
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
