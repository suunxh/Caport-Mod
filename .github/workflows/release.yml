name: Build and release mod JAR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache
    steps:
      - name: Check out the exact build commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Java 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare the Forge workspace
        run: ./gradlew setupDecompWorkspace getAssetIndex -x getAssets --no-daemon --max-workers=2

      - name: Download and verify Minecraft assets over HTTPS
        run: python3 tools/fetch-assets.py

      - name: Build and run the complete test suite
        run: ./gradlew setupDecompWorkspace build --no-daemon --max-workers=2

      - name: Publish the installable JAR and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_REF_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: bash tools/publish-release.sh
